name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Compile Code Base
        run: mvn --batch-mode clean compile

      - name: Run Automated Test Suites
        run: mvn --batch-mode test

      - name: Package Executable Distribution
        run: mvn --batch-mode package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-ready-jar-jdk-${{ matrix.java-version }}
          path: target/*.jar
          retention-days: 5
  deploy-staging:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Staging Container
        run: |
          echo "Approval granted! Deploying to staging stack..."
          docker compose up -d
